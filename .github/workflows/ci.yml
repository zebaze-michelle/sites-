name: CI-CD AfriShop 
on: 
  push: 
    branches: [main] 
  workflow_dispatch: 
permissions: # Autorisations de publication 
  contents: read 
  pages: write 
  id-token: write 
jobs: 
  verification: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Recuperer le code 
        uses: actions/checkout@v4 
      - name: Verifier les fichiers non vides 
        run: | 
          test -s index.html 
          test -s style.css 
      - name: Configurer Pages 
        uses: actions/configure-pages@v5 
      - name: Preparer le site 
        run: | 
          mkdir -p public 
          cp index.html style.css public/ 
          if [ -d images ]; then cp -r images public/; fi 
      - name: Creer l artefact 
        uses: actions/upload-pages-artifact@v3 
        with: 
          path: public 
  deploiement: 
    needs: verification # Attend le succes du premier job 
    runs-on: ubuntu-latest 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
    steps: 
      - name: Deployer le site 
        id: deployment 
        uses: actions/deploy-pages@v4